[project]
version = "0.7.6"
name = "wagtail_parler"
description = "Brings \"omelette du fromage\" 🧀 from parler into wagtail 🐦 (via wagtail snippets or modeladmin)"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
  {name = "Webu", email = "contact@webu.coop"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Wagtail",
  "Framework :: Wagtail :: 5",
  "Framework :: Wagtail :: 6",
  "Framework :: Wagtail :: 7",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">= 3.9"
dependencies = [
  "Django>=4.2",
  "wagtail>=5.0",
  "django-parler>=2.3",
  "wagtail_modeladmin>=2.0,<3.0",
]

[project.urls]
    Source = "https://github.com/webu/wagtail-parler"
    Tracker = "https://github.com/webu/wagtail-parler/issues"
    Documentation = "https://wagtail-parler.readthedocs.io/en/latest/"

[tool.flake8]
    exclude = "build,.git,.tox,./tests/env,./.venv"
    max-line-length = 99

[tool.djlint]
    profile = "django"
    preserve_blank_lines = true
    format_js = false
    format_css = true

[tool.pyright]
    exclude = [".venv"]
    venvPath = "."
    venv = "./.venv"

[tool.ruff]
    include = ["pyproject.toml", "src/**/*.py"]
    line-length = 99
    extend-exclude = [
        "__pycache__",
        "migrations"
    ]

[tool.ruff.lint]
    select = [
        "F401", # unused imports
        "I",
    ] # https://docs.astral.sh/ruff/rules

[tool.ruff.lint.isort]
    length-sort = false
    force-single-line = true
    force-sort-within-sections = true
    known-first-party = ["wagtail_parler"]
    known-third-party = ["parler", "wagtail"]
    section-order = ["future", "standard-library", "pylib", "django", "third-party", "first-party", "local-folder"]
    known-local-folder = []

[tool.ruff.lint.isort.sections]
"django" = ["django"]
"pylib" = ["dateutil"]
    
[tool.coverage.run]
    omit = [
        "*/wagtail_parler_tests/*",
        "./setup.py", 
        "*/.tox/*", 
        "*/migrations/*"
    ]
    exclude_lines = [
        "pragma: no cover",
        "if TYPE_CHECKING:"   
    ]

[tool.coverage.report]
    omit = [
        "*/wagtail_parler_tests/*",
        "./setup.py", 
        "*/.tox/*", 
        "*/.migrations/*"
    ]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
test = [
    {include-group = "dev"},
    "coverage>=3.7.0",
    "requests",
    "beautifulsoup4",
    "flake8",
    "mypy",
    "types-requests",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages]
find = {}

[tool.mypy]
disable_error_code = ["import-untyped"]
