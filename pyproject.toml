[tool.flake8]
    exclude = "build,.git,.tox,./tests/env,./.venv"
    max-line-length = 99

[tool.djlint]
    profile = "django"
    preserve_blank_lines = true
    format_js = false
    format_css = true

[tool.pyright]
    exclude = [".venv"]
    venvPath = "."
    venv = "./.venv"

[tool.ruff]
    include = ["pyproject.toml", "src/**/*.py"]
    line-length = 99
    extend-exclude = [
        "__pycache__",
        "migrations"
    ]

[tool.ruff.lint]
    select = [
        "F401", # unused imports
        "I",
    ] # https://docs.astral.sh/ruff/rules

[tool.ruff.lint.isort]
    length-sort = false
    force-single-line = true
    force-sort-within-sections = true
    known-first-party = ["wagtail_parler"]
    known-third-party = ["parler", "wagtail"]
    section-order = ["future", "standard-library", "pylib", "django", "third-party", "first-party", "webu", "local-folder"]
    known-local-folder = []

[tool.ruff.lint.isort.sections]
"django" = ["django"]
"pylib" = ["dateutil"]
"webu" = ["webu", "faq"]
    
[tool.coverage.run]
    omit = [
        "*/wagtail_parler_tests/*",
        "./setup.py", 
        "*/.tox/*", 
        "*/migrations/*"
    ]
    exclude_lines = [
        "pragma: no cover",
        "if TYPE_CHECKING:"   
    ]

[tool.coverage.report]
    omit = [
        "*/wagtail_parler_tests/*",
        "./setup.py", 
        "*/.tox/*", 
        "*/.migrations/*"
    ]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
